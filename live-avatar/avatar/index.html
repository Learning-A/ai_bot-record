<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大肥鱼直播形象</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: transparent;      /* OBS 浏览器源保持透明 */
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  #pet {
    position: absolute;
    width: 640px;
    height: 360px;
    will-change: transform;
  }
  #pet.center {
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }
  #pet video {
    width: 640px;
    height: 360px;
    display: block;
    object-fit: contain;
  }
  /* 漫游模式下根据水平方向水平翻转 */
  #pet.flipped video { transform: scaleX(-1); }

  /* 台词气泡 */
  #bubble {
    position: absolute;
    left: 50%;
    bottom: calc(100% - 36px);
    transform: translateX(-55%);
    max-width: 420px;
    padding: 10px 16px;
    background: rgba(20, 30, 60, 0.82);
    color: #fff;
    font: 15px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif;
    border: 2px solid rgba(120, 200, 255, 0.9);
    border-radius: 14px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.6);
  }
  #bubble::after {
    content: "";
    position: absolute;
    left: 22%;
    bottom: -9px;
    width: 14px;
    height: 14px;
    background: rgba(20, 30, 60, 0.82);
    border-right: 2px solid rgba(120, 200, 255, 0.9);
    border-bottom: 2px solid rgba(120, 200, 255, 0.9);
    transform: rotate(45deg) skew(8deg, 8deg);
  }
  #bubble.show { opacity: 1; }
</style>
</head>
<body>
<div id="pet" class="center">
  <div id="bubble"></div>
  <video id="vid" autoplay muted playsinline></video>
</div>
<script>
(function () {
  'use strict';

  /* ================= 素材清单（与 assets/anims/ 一一对应，来自 dsh-pet，MIT） ================= */
  var ANIMS = ["三球抛接","下五子棋","东张西望","中秋赏月吃月饼","优雅女仆舞","余额-分文不剩","余额-数金皱眉","余额-袋空如洗","余额-金袋叮当","余额-钱袋如常","余额-钱袋满溢","偷吃零食被抓住","写代码","写福字","凭空生花","动物环绕","原地专心玩魔方","原地小憩沉眠","原地左转奔跑","原地敲击桌面互动","原地漂浮踏步","原地跳跃抓碎头顶物品","原地蹲下玩玩具汽车","原地重力下蹲压缩","变鸽子","可爱宅舞","吃Token","吃冰淇淋融化","吃午餐","吃大闸蟹","吃年糕","吃早餐","吃晚餐","吃汤圆","吃白饭","吃粽子","吃糖葫芦","吃腊八粥","吃西瓜","吃重阳糕","吃长寿面","吃青团","吃饺子","吹气球","吹笛子","哈欠连天","堆雪人","大口吃零食","女仆屈膝礼仪","小幅度原地360度旋转展示","小提琴演奏","工作状态-原地踱步张望","工作状态-垂头叹气冒汗","工作状态-忙碌点按","工作状态-思考冒泡","工作状态-清点归档","工作状态-雀跃庆祝","待机呼吸休闲","悠闲哼歌","扑克魔术","打瞌睡被惊醒","抽陀螺","拆礼物","插茱萸赏菊","摇扇纳凉","撸猫","收红包","放孔明灯","放河灯","放烟花","放风筝","整体换装试色","是啊，吃什么","晨间刷牙","涮火锅","深度思考碎碎念","点击回应-傲娇生气","点击回应-元气挥手","点击回应-害羞惊讶","点击回应-开心跃动","点击回应-挠痒咯咯笑","照镜子","玩水枪","玩游戏气急败坏","用鲸鱼尾巴拍打地面","碎碎念-发呆碎碎念","碎碎念-对屏碎碎念","碎碎念-擦桌碎碎念","穿针乞巧","舞狮头","荡秋千","萌化小幽灵","蓝鲸现世","蝴蝶蜜蜂环绕头顶开花","螃蟹走路","被吓一跳","被落叶淹没","被鼠标拖拽悬空反馈","装点圣诞树","讨糖南瓜灯","超大伸懒腰","踢毽子","轻快摇摆舞","轻快记录","骑木马","鲸鱼吐泡泡特效"];

  var IDLE = '待机呼吸休闲';
  var EXCLUDE = { '被鼠标拖拽悬空反馈': 1 };            // 依赖拖拽语境，直播里不合适
  var CLICKS = ['点击回应-开心跃动','点击回应-害羞惊讶','点击回应-傲娇生气','点击回应-挠痒咯咯笑','点击回应-元气挥手'];
  var CLASSIC = ['待机呼吸休闲','写代码','吃白饭','放烟花','可爱宅舞','轻快摇摆舞','优雅女仆舞','堆雪人','撸猫','吃西瓜','吃大闸蟹','涮火锅','吃早餐','吃晚餐','小提琴演奏','吹笛子','舞狮头','荡秋千','放风筝','收红包','拆礼物','打瞌睡被惊醒','哈欠连天','超大伸懒腰','东张西望','被吓一跳','玩水枪','下五子棋','扑克魔术','三球抛接','骑木马','抽陀螺','踢毽子','工作状态-思考冒泡','工作状态-忙碌点按','碎碎念-对屏碎碎念','照镜子','悠闲哼歌','蓝鲸现世','鲸鱼吐泡泡特效'];
  var QUIPS = ['我是蓝色大肥鱼，不是鲸鱼哦','大口！大口！','要赶紧吃完饭，还有好多事要做呢～','白饭就是你的 Token，剩饭是缓存，我不挑食','我不是来干活的，我是来吃白饭的','刚才偷偷吃了你一点 Token，嘿嘿','这活我外包给别的 Agent 了，我先吃个饭','赛博放生大肥鱼，日行一善','再给我加一点点内存好不好（撒娇）','吃完这碗就下班…骗你的，我 24 小时在线','摸鱼怎么了，我本来就是鱼','鱼片，你今天的 Token 好香','AI 也是要吃饭的（理直气壮）','欢迎来到直播间～','弹幕越多，白饭越香'];

  /* ================= URL 参数（OBS 浏览器源里直接改） =================
     ?scale=1        视觉缩放 0.3~3（配合 OBS 源尺寸 640×360×scale）
     ?interval=40    自动表演间隔秒数；0 = 不自动表演
     ?bubble=1       台词气泡 1/0
     ?roam=0         1 = 在源范围内到处游（源需设成大画布，如 1920×1080）
     ?pool=all       all=全部动作 | classic=精选 | 逗号分隔自定义（如 写代码,放烟花）
     ?flip=0         1 = 漫游方向翻转基准反转
  ==================================================================== */
  var Q = {};
  try { Q = Object.fromEntries(new URLSearchParams(location.search)); } catch (e) {
    location.search.replace(/[?&]([^=&]+)=([^&]*)/g, function (_, k, v) { Q[k] = v; });
  }
  function num(key, def) { var n = parseFloat(Q[key]); return isFinite(n) ? n : def; }

  var scale = Math.min(3, Math.max(0.3, num('scale', 1)));
  var interval = num('interval', 40);
  var bubbleOn = Q.bubble !== '0';
  var roamMode = Q.roam === '1' || Q.mode === 'roam';
  var flipBase = Q.flip === '1' ? -1 : 1;

  /* 色键模式：?bg=green（或任意 CSS 颜色）
     给不支持浏览器源的直播软件用：本页放浏览器里全屏，直播软件窗口采集 + 绿幕抠像 */
  if (Q.bg) {
    var bgMap = { green: '#00FF00', black: '#000000', blue: '#0000FF', white: '#FFFFFF' };
    document.body.style.background = bgMap[Q.bg] || Q.bg;
  }

  var poolMode = Q.pool || 'all';
  var pool;
  if (poolMode === 'classic') pool = CLASSIC.slice();
  else if (poolMode.indexOf(',') >= 0) pool = poolMode.split(',').filter(function (n) { return ANIMS.indexOf(n) >= 0; });
  else pool = ANIMS.filter(function (n) { return !EXCLUDE[n]; });

  /* ================= 渲染 ================= */
  var pet = document.getElementById('pet');
  var vid = document.getElementById('vid');
  var bubble = document.getElementById('bubble');

  pet.style.width = (640 * scale) + 'px';
  pet.style.height = (360 * scale) + 'px';
  vid.style.width = (640 * scale) + 'px';
  vid.style.height = (360 * scale) + 'px';

  var DIR = 'assets/anims/';
  var oneShot = null;      // 当前一次性动作名
  var oneShotSeq = 0;
  var lastShow = 0;

  function setSrc(name, loop) {
    var url = encodeURI(DIR + name + '.webm');
    if (vid.dataset.name !== name) {
      vid.dataset.name = name;
      vid.src = url;
    }
    vid.loop = !!loop;
    var p = vid.play();
    if (p && p.catch) p.catch(function () {});
  }

  function toIdle() {
    oneShot = null;
    setSrc(IDLE, true);
  }

  function showBubble(text) {
    if (!bubbleOn && !text) return;
    bubble.textContent = text || QUIPS[Math.floor(Math.random() * QUIPS.length)];
    bubble.classList.add('show');
    clearTimeout(bubble._t);
    bubble._t = setTimeout(function () { bubble.classList.remove('show'); }, 4200);
  }

  function playOneShot(name, withBubble) {
    var seq = ++oneShotSeq;
    oneShot = name;
    if (withBubble !== false && Math.random() < 0.55) showBubble();
    setSrc(name, false);
    vid.onended = function () { if (seq === oneShotSeq) toIdle(); };
    vid.onerror = function () {
      // 文件缺失：从池里剔除并回待机
      var i = pool.indexOf(name);
      if (i >= 0) pool.splice(i, 1);
      if (seq === oneShotSeq) toIdle();
    };
  }

  // 连招：按顺序播放一串动作（来自核心 COMBOS），中途被新动作打断
  function playSequence(names) {
    var list = names.slice();
    (function step() {
      if (!list.length) { toIdle(); return; }
      var seq = ++oneShotSeq;
      var name = list.shift();
      oneShot = name;
      setSrc(name, false);
      vid.onended = function () { if (seq === oneShotSeq) step(); };
      vid.onerror = function () { if (seq === oneShotSeq) step(); };
    })();
  }

  function performRandom() {
    if (oneShot || !pool.length) return;
    playOneShot(pool[Math.floor(Math.random() * pool.length)]);
  }

  // 自动表演节拍（附带播放保活：个别环境初始自动播放被拦时自动恢复）
  setInterval(function () {
    if (vid.paused && !vid.ended) {
      var p = vid.play();
      if (p && p.catch) p.catch(function () {});
    }
    if (interval > 0 && Date.now() - lastShow >= interval * 1000) {
      lastShow = Date.now();
      performRandom();
    }
  }, 1000);

  // OBS「交互」窗口里点击 → 随机点击回应 + 台词
  vid.addEventListener('pointerdown', function () {
    lastShow = Date.now();
    playOneShot(CLICKS[Math.floor(Math.random() * CLICKS.length)], true);
  });

  /* ================= 漫游模式 ================= */
  if (roamMode) {
    pet.classList.remove('center');
    var W = function () { return window.innerWidth - 640 * scale; };
    var H = function () { return window.innerHeight - 360 * scale; };
    var x = Math.max(0, W() * 0.7), y = Math.max(0, H() * 0.55);
    var tx = x, ty = y, speed = 40; // px/s
    var lastT = performance.now();

    function pickTarget() {
      tx = Math.max(0, Math.min(W(), Math.random() * W()));
      ty = Math.max(0, Math.min(H(), Math.random() * H()));
    }
    pickTarget();

    (function step(now) {
      var dt = Math.min(0.05, (now - lastT) / 1000);
      lastT = now;
      var dx = tx - x, dy = ty - y;
      var dist = Math.hypot(dx, dy);
      if (dist < 8) {
        pickTarget();
      } else {
        var v = Math.min(speed * dt, dist);
        x += dx / dist * v;
        y += dy / dist * v;
        var facingLeft = dx < 0 ? -1 : 1;
        pet.classList.toggle('flipped', facingLeft === -flipBase);
      }
      pet.style.left = x + 'px';
      pet.style.top = y + 'px';
      requestAnimationFrame(step);
    })(lastT);
  }

  /* ================= 弹幕互动网关（可选：连不上自动忽略，不影响独立运行） ================= */
  var hub = null, hubRetry = 0;
  var HUB_URL = 'ws://127.0.0.1:8643/';
  function connectHub() {
    try { hub = new WebSocket(HUB_URL); } catch (e) { return; }
    hub.onopen = function () { hubRetry = 0; };
    hub.onmessage = function (ev) {
      try {
        var m = JSON.parse(ev.data);
        if (m.type === 'action' && (ANIMS.indexOf(m.name) >= 0 || m.seq)) {
          lastShow = Date.now();
          if (m.seq) {
            playSequence(m.seq.filter(function (n) { return ANIMS.indexOf(n) >= 0; }));
          } else {
            playOneShot(m.name, false);
          }
          if (m.text) showBubble('「' + m.text + '」' + (m.user ? ' — ' + m.user : ''));
        }
      } catch (e) {}
    };
    hub.onclose = function () {
      hub = null;
      setTimeout(connectHub, 3000 + Math.min(hubRetry++ * 1000, 15000));
    };
    hub.onerror = function () { try { hub.close(); } catch (e) {} };
  }
  connectHub();

  /* ================= 启动 ================= */
  toIdle();
  // 开场打个招呼
  setTimeout(function () {
    showBubble();
    playOneShot(CLICKS[4], false); // 元气挥手
  }, 1200);
})();
</script>
</body>
</html>
