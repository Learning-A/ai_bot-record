<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>大肥鱼点歌台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(160deg, #101a30 0%, #0b1222 100%);
    color: #eaf2ff; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px;
    background: rgba(255,255,255,.05); border-bottom: 1px solid rgba(255,255,255,.1);
    font-size: 14px;
  }
  header b { font-size: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #e05a5a; transition: background .3s; }
  .dot.on { background: #3ecf6e; box-shadow: 0 0 8px #3ecf6e; }
  .mode { margin-left: auto; color: #9fb4d8; font-size: 12px; }
  .mode b { color: #ffd452; font-size: 12px; }

  .main { flex: 1; display: flex; min-height: 0; }
  .player-side {
    flex: 1.6; display: flex; flex-direction: column; padding: 14px; min-width: 0;
  }
  #player {
    flex: 1; width: 100%; border-radius: 12px; overflow: hidden; background: #000;
    border: 1px solid rgba(255,255,255,.12); position: relative;
  }
  #player iframe { width: 100%; height: 100%; border: 0; }
  #player .empty {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; color: #6c7a94; font-size: 15px;
  }
  .now { padding: 10px 4px 2px; font-size: 14px; color: #9fb4d8; }
  .now b { color: #ffd452; display: inline-block; max-width: 46em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }

  .queue-side {
    flex: 1; min-width: 300px; max-width: 420px; display: flex; flex-direction: column;
    border-left: 1px solid rgba(255,255,255,.1);
  }
  .q-head {
    display: flex; align-items: center; padding: 12px 14px 6px; font-size: 13px; color: #9fb4d8;
  }
  .q-head .n { margin-left: 6px; color: #23ade5; font-weight: 700; }
  .q-head button {
    margin-left: auto; font-size: 12px; padding: 5px 12px; border-radius: 8px; cursor: pointer;
    background: rgba(255,255,255,.09); color: #eaf2ff; border: 1px solid rgba(255,255,255,.22);
  }
  .q-head button:hover { background: #e05a5a; border-color: #e05a5a; }
  #lock.locked { background: #b8860b; border-color: #ffd452; color: #ffd452; }
  #queue { flex: 1; overflow-y: auto; padding: 4px 14px 14px; font-size: 14px; }
  #queue .row {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
    margin-bottom: 4px; background: rgba(255,255,255,.05); color: #cdd9ee;
  }
  #queue .row.playing { background: rgba(251,114,153,.2); color: #fff; }
  #queue .row .idx { color: #23ade5; font-weight: 700; width: 20px; }
  #queue .row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #queue .row .u { color: #8a93a8; font-size: 12px; }
  #queue .row .skip {
    font-size: 12px; padding: 3px 10px; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); color: #eaf2ff;
  }
  #queue .row .skip:hover { background: #23ade5; }
  .empty-q { color: #6c7a94; padding: 14px; font-size: 13px; }

  /* 首次点击解锁层（浏览器音频自动播放策略） */
  #unlock {
    position: fixed; inset: 0; z-index: 99; display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center; background: rgba(8,14,28,.92); cursor: pointer;
  }
  #unlock .big { font-size: 26px; font-weight: 900; color: #ffd452; }
  #unlock .tip { font-size: 14px; color: #9fb4d8; max-width: 30em; text-align: center; line-height: 1.7; }
  #unlock.hide { display: none; }
</style>
</head>
<body>
<header>
  <b>🎤 大肥鱼点歌台</b>
  <span class="dot" id="dot"></span><span style="color:#9fb4d8">核心总线</span>
  <span class="mode">模式：<b id="mode">待命</b></span>
</header>

<div id="unlock">
  <div class="big">▶ 点一下，开启点歌台</div>
  <div class="tip">首次点击用于解锁浏览器的音频自动播放权限。<br>
  开着本页面时，弹幕点歌会在这里自动播放并排队（B 模式）；<br>
  关掉本页面，系统自动退回"浏览器开新标签"模式（A 模式）。</div>
</div>

<div class="main">
  <div class="player-side">
    <div id="player">
      <iframe id="pf" allow="autoplay; encrypted-media" style="display:none"></iframe>
      <video id="ov" controls playsinline style="display:none;width:100%;height:100%;background:#000"></video>
      <div class="empty" id="pempty">🎵 等待点歌…<span style="font-size:12px">弹幕发送「点歌 歌名」试试</span></div>
    </div>
    <div class="now">当前播放：<b id="cur">—</b></div>
  </div>
  <div class="queue-side">
    <div class="q-head">队列<span class="n" id="qn">0</span>
      <button id="replay" title="从头重播当前歌曲">↻ 重播</button>
      <button id="lock" title="冻结自动切歌计时器：暂停播放期间不会被跳歌">⏸ 锁定切歌</button>
      <button id="clear">清空队列</button>
    </div>
    <div id="queue"><div class="empty-q">还没有人点歌</div></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var pf = document.getElementById('pf');
  var ov = document.getElementById('ov');
  ov.addEventListener('ended', function () { if (ownMode) { next(); } });
  var pempty = document.getElementById('pempty');
  var cur = document.getElementById('cur');
  var queueEl = document.getElementById('queue');
  var qn = document.getElementById('qn');
  var modeEl = document.getElementById('mode');

  var ownMode = false;      // true=自有video直链播放(ended事件精确切歌) false=iframe兜底(定时器+宽限)
  var queue = [];          // [{bvid,title,user,duration}]
  var playing = null;
  var unlocked = false;
  var hub = null;
  // 自动切歌计时（挂钟可冻结模型：锁定=冻结，解除=按剩余时间恢复）
  // 自适应缓冲：默认歌曲时长 +12s 起步；观众侧网络卡顿导致提前切歌时，
  // 点「续播」自动 +15s（上限 90s）并持久化，越用越贴合你的实际网络
  var BUF_KEY = 'jukebox_buffer_sec';
  var bufferSec = Math.min(90, Math.max(8, parseInt(localStorage.getItem(BUF_KEY) || '12', 10) || 12));
  var autoTimer = { handle: null, total: 0, elapsedBefore: 0, startedAt: 0 };
  var pauseLock = false;
  var graceHandle = null;      // 到时后的 15 秒宽限（防网络卡顿导致提前切歌）
  var graceActive = false;
  function elapsed() { return autoTimer.elapsedBefore + (pauseLock ? 0 : Date.now() - autoTimer.startedAt); }
  function clearGrace() { clearTimeout(graceHandle); graceActive = false; }
  function armTimer() {
    clearTimeout(autoTimer.handle);
    if (pauseLock || !playing || !autoTimer.total) return;
    var remain = Math.max(1000, autoTimer.total - elapsed());
    autoTimer.handle = setTimeout(onTimeUp, remain);
  }
  function resetTimer(totalMs) {
    clearTimeout(autoTimer.handle);
    clearGrace();
    autoTimer.total = totalMs;
    autoTimer.elapsedBefore = 0;
    autoTimer.startedAt = Date.now();
    if (!pauseLock) armTimer();
  }
  // 到时不再直接切歌：先给 15 秒宽限——歌没放完可一键续播（并自学习加大缓冲）
  function onTimeUp() {
    if (!playing || pauseLock) return;
    graceActive = true;
    graceHandle = setTimeout(next, 15000);
    renderQueue();
  }
  function postpone() {
    clearGrace();
    if (!playing) return;
    bufferSec = Math.min(90, bufferSec + 15);
    localStorage.setItem(BUF_KEY, String(bufferSec));
    autoTimer.total = elapsed() + 30000;   // 当前歌再续 30 秒
    armTimer();
    renderQueue();
  }

  function setDot(on) { document.getElementById('dot').classList.toggle('on', on); }

  function send(obj) {
    if (hub && hub.readyState === 1) hub.send(JSON.stringify(obj));
  }
  function hello() { send({ type: 'relay', data: { type: 'jukebox_hello' } }); }

  // ---------------- 播放控制 ----------------
  function play(song) {
    playing = song;
    cur.textContent = song.title + '（' + song.user + ' 点播）';
    pempty.style.display = 'none';
    clearTimeout(autoTimer.handle);
    clearGrace();
    if (song.media) {
      // 精确模式：自有 video 直链播放——ended 事件播完才切，暂停/卡顿永不误切
      ownMode = true;
      pf.style.display = 'none';
      ov.style.display = 'block';
      ov.src = song.media;   // src 赋值自动重新加载（同曲重播也生效）
      var pp = ov.play();
      if (pp && pp.catch) pp.catch(function () {});
      modeEl.textContent = '播放中（精确模式）';
    } else {
      // 兜底模式：iframe 播放器 + 定时器（时长+自学习缓冲）+ 到时宽限
      ownMode = false;
      ov.style.display = 'none';
      pf.style.display = 'block';
      // _r 时间戳：连续播同一首歌时 src 变化强制重载 iframe（否则不重载、看似连播失效）
      pf.src = 'https://player.bilibili.com/player.html?bvid=' + song.bvid +
               '&autoplay=1&danmaku=0&high_quality=1&_r=' + Date.now();
      modeEl.textContent = '播放中（兜底模式）' + (pauseLock ? '·锁定' : '');
      resetTimer(song.duration * 1000 + bufferSec * 1000);
    }
    renderQueue();
  }

  function next() {
    if (queue.length) {
      play(queue.shift());
    } else {
      playing = null;
      cur.textContent = '—';
      pf.style.display = 'none';
      ov.style.display = 'none';
      ov.pause();
      pempty.style.display = 'flex';
      modeEl.textContent = '待命';
      clearTimeout(autoTimer.handle);
      clearGrace();
      autoTimer.total = 0;
    }
    renderQueue();
  }

  function enqueue(song) {
    if (queue.length >= 20) return;
    // 同一首歌已在播放或已在队列：不重复入队
    if ((playing && playing.bvid === song.bvid) ||
        queue.some(function (s) { return s.bvid === song.bvid; })) return;
    queue.push(song);
    renderQueue();
    if (!playing && unlocked) play(queue.shift());
    else if (!playing && !unlocked) {
      // 未解锁时也先弹出来，等用户点击后播
      document.getElementById('unlock').classList.remove('hide');
    }
  }

  function renderQueue() {
    qn.textContent = queue.length;
    if (!queue.length && !playing) {
      queueEl.innerHTML = '<div class="empty-q">还没有人点歌</div>';
      return;
    }
    var html = '';
    if (playing) {
      html += '<div class="row playing"><span class="idx">▶</span><span class="t">' +
              esc(playing.title) + '</span><span class="u">' + esc(playing.user) + '</span>' +
              (graceActive ? '<button class="skip post">还没放完·续播</button>' : '') +
              '<button class="skip">跳过</button></div>';
    }
    queue.forEach(function (s, i) {
      html += '<div class="row"><span class="idx">' + (i + 1) + '</span><span class="t">' +
              esc(s.title) + '</span><span class="u">' + esc(s.user) + '</span>' +
              '<button class="skip">跳过</button></div>';
    });
    queueEl.innerHTML = html;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  queueEl.addEventListener('click', function (ev) {
    if (ev.target.classList.contains('post')) { postpone(); return; }
    if (!ev.target.classList.contains('skip')) return;
    var rows = Array.prototype.slice.call(queueEl.querySelectorAll('.row'));
    var idx = rows.indexOf(ev.target.closest('.row'));
    if (idx < 0) return;
    if (playing && idx === 0) { next(); }
    else {
      var adj = playing ? idx - 1 : idx;
      if (adj >= 0 && adj < queue.length) { queue.splice(adj, 1); renderQueue(); }
    }
  });
  document.getElementById('clear').onclick = function () { queue = []; renderQueue(); };
  var lockBtn = document.getElementById('lock');
  lockBtn.onclick = function () {
    pauseLock = !pauseLock;
    if (pauseLock) {
      clearGrace();
      autoTimer.elapsedBefore += Date.now() - autoTimer.startedAt; // 冻结已播时长
      clearTimeout(autoTimer.handle);
      lockBtn.classList.add('locked');
      lockBtn.textContent = '▶ 恢复切歌';
      modeEl.textContent = playing ? '播放中（切歌已锁定）' : '待命（切歌已锁定）';
    } else {
      autoTimer.startedAt = Date.now();
      armTimer();
      lockBtn.classList.remove('locked');
      lockBtn.textContent = '⏸ 锁定切歌';
      modeEl.textContent = playing ? '播放中' : '待命';
    }
  };
  document.getElementById('replay').onclick = function () {
    if (playing) { play(playing); }   // 时间戳重载机制保证 iframe 重新开始
  };

  // ---------------- 解锁层 ----------------
  document.getElementById('unlock').addEventListener('click', function () {
    unlocked = true;
    this.classList.add('hide');
    hello();
    if (ownMode && playing) { var pp = ov.play(); if (pp && pp.catch) pp.catch(function () {}); }
    if (!playing && queue.length) play(queue.shift());
  });

  // ---------------- 总线 ----------------
  var hubPort = '8643';
  try {
    var qp = new URLSearchParams(location.search).get('hub');
    if (qp) hubPort = qp;
  } catch (e) {}
  function connect() {
    try { hub = new WebSocket('ws://127.0.0.1:' + hubPort + '/'); } catch (e) { return; }
    hub.onopen = function () { setDot(true); hello(); setInterval(hello, 30000); };
    hub.onmessage = function (ev) {
      try {
        var m = JSON.parse(ev.data);
        if (m.type === 'song' && m.bvid) {
          enqueue({ bvid: m.bvid, title: m.title || m.bvid, user: m.user || '观众',
                    duration: m.duration || 240, media: m.media || null });
        }
      } catch (e) {}
    };
    hub.onclose = function () { setDot(false); setTimeout(connect, 3000); };
    hub.onerror = function () { try { hub.close(); } catch (e) {} };
  }
  connect();
  renderQueue();
})();
</script>
</body>
</html>
